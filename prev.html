<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Work - Coherent</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header dynamically rendered via js/app.js -->
    <header id="main-header"></header>

    <section class="margin">
        <!-- Heading Previous work -->
        <section id="cnctbanner1" class="prevbanner">
            <div class="cnctbanner1heading prevbannerheading">
                <h1>Previous Work</h1>
            </div>
        </section>

        <!-- Previous Work Portfolio Grid -->
        <section id="previouswork">
          <div class="allworkwrap" id="previous-work-list">

          </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
