<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services - Coherent</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <!-- Header dynamically rendered via js/app.js -->
    <header id="main-header"></header>

    <section class="margin">
      <section id="cnctbanner1" class="servicebanner">
        <div class="cnctbanner1heading">
          <h1 data-site="services-title">Services</h1>
        </div>
      </section>

      <!-- Services Content Banner -->
      <section id="banner2">
        <div class="desc">
          <p data-site="services-description"></p>
        </div>
        <div class="servicewrap" id="services-list">
          <!-- Populated dynamically from data/site-data.json -->
        </div>
      </section>
    </section>

    <!-- Footer dynamically rendered via js/app.js -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
