<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Coherent</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <!-- Header dynamically rendered via js/app.js -->
    <header id="main-header"></header>

    <section class="margin">
        <!-- Contact Banner 1 -->
        <section id="cnctbanner1" class="contactbanner">
            <div class="cnctbanner1heading">
                <h1>Contact</h1>
            </div>
        </section>

        <!-- Contact Banner 2 -->
        <section id="cnctbanner2">
            <div class="cnctbanner2left">
                <h4 data-site="contact-headline">Sounds interesting? Let's get in touch!</h4>
                <p data-site="contact-subtext">Please feel free to call or email us, or use our contact form to get in touch with us. We look forward to hearing from you!</p>
            </div>
            <div class="cnctbanner2right">
                <form class="contactform" action="https://formspree.io/f/xdoqdlap" method="POST">
                    <div class="forminput">
                        <input type="text" id="Name" name="Name" size="61" placeholder="Name" class="" required>
                    </div>
                    <div class="forminput">
                        <input type="email" id="Email" name="email" size="61" placeholder="Email*" class="" required>
                    </div>
                    <div class="forminput">
                        <textarea id="Message" name="message" placeholder="Message*" class="fcf-form-control" rows="5" cols="67" maxlength="3000" required></textarea>
                    </div>
                    <div class="forminput formsubmit">
                        <button type="submit" id="fcf-button" class="fcf-btn fcf-btn-primary fcf-btn-lg fcf-btn-block">SEND</button>
                    </div>
                </form>
            </div>
        </section>
    </section>

    <!-- Footer dynamically rendered via js/app.js -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
