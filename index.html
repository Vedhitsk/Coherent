<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coherent Designers & Consultants</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <!-- Header dynamically rendered via js/app.js -->
    <header id="main-header"></header>

    <section class="margin">
        <!-- Banner 1 -->
        <section id="banner1">
            <div class="subheading">
                <h5 data-site="home-subheading">Structural Engineering Solutions</h5>
            </div>
            <div class="heading">
                <h1 data-site="home-title">Innovative & Cost-Effective Structural Design</h1>
            </div>
            <div class="description">
                <p data-site="home-description"></p>
            </div>
        </section>

        <!-- Banner 2 (Services Preview) -->
        <section id="banner2">
            <h3>Services</h3>
            <div class="servicewrap" id="services-list">
                <!-- Populated dynamically from data/site-data.json -->
            </div>
        </section>

        <!-- Banner 3 (Previous Work Preview) -->
        <section id="banner3">
            <h3>Previous Work</h3>
            <div class="prevbtn">
                <button><a href="prev.html">View Portfolio</a></button>
            </div>
        </section>
    </section>

    <!-- Footer dynamically rendered via js/app.js -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
